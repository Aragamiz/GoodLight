# GoodLight 配置文件模板 (请复制为 config.yaml 后填入你的本地配置)

home_assistant:
  # 局域网访问 Home Assistant API
  url: "http://homeassistant.local:8123"
  # 长期访问令牌 (支持环境变量 GOODLIGHT_HA_TOKEN 传入)
  token: "YOUR_HA_LONG_LIVED_ACCESS_TOKEN"

location:
  # 地理坐标 (默认北京坐标，用于计算太阳真实高度角、真太阳时与二十四节气)
  latitude: 39.9042
  longitude: 116.4074
  elevation: 0
  timezone_offset: 8.0  # 时区偏移 (小时，如 UTC+8 为 8.0)

# 支持多个独立灯光分组 (例如: 客厅吸顶灯组、卧室组、书房组)
groups:
  - id: "living_room"
    name: "客厅吸顶灯主组"
    enabled: true
    # 专属模型数据文件名
    profile_path: "profile_living_room.json"
    # 按优先级排列 (先开主灯，高照度时才协同开副灯/氛围灯)
    lights:
      - entity_id: "light.leishi_cn_860863113_eps127_s_2_light"
        name: "雷士吸顶灯主灯"
        priority: 1
        min_kelvin: 3000
        max_kelvin: 5700
        mode: "active"      # 'active' (全主动巡航) | 'turn_on' (仅开灯打断) | 'passive' (被动学习)
      - entity_id: "light.leishi_cn_860863113_eps127_s_4_ambient_light"
        name: "雷士吸顶灯氛围灯"
        priority: 2
        min_kelvin: 2700
        max_kelvin: 6500
        mode: "turn_on"

  - id: "desk_room"
    name: "书房/工作台灯组"
    enabled: true
    profile_path: "profile_desk.json"
    lights:
      - entity_id: "light.yeelink_cn_61586629_lamp1_s_2_light"
        name: "Yeelight 智能台灯"
        priority: 1
        min_kelvin: 2700
        max_kelvin: 6500
        mode: "turn_on"

sensors:
  temperature: ""  # 如: sensor.indoor_temperature
  weather: ""      # 如: weather.home

learning:
  take_over_learn: true
  learning_rate: 0.25
  debounce_seconds: 3.0
